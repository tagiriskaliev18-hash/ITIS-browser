<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ITIS Search</title>
    <!-- Единый стиль Mind (MindKit design/): иконки с градиентом, 3D, bounce -->
    <link rel="stylesheet" href="mind/mind-ui.css">
    <script src="mind/mind-ui.js" defer></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap');

        *,*::before,*::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: #08080F;
            color: #E2E2E2;
            font-family: 'Inter', 'Segoe UI', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* ========== ЖИВОЙ CSS-ФОН: 3D сферы, орбиты ========== */
        .scene {
            position: fixed; inset: 0;
            z-index: 0;
            overflow: hidden;
            perspective: 800px;
        }

        /* Глубокий градиентный фон с "туманом" */
        .scene::before {
            content: '';
            position: absolute; inset: 0;
            background: 
                radial-gradient(ellipse 60% 50% at 20% 50%, rgba(91,141,238,0.09) 0%, transparent 70%),
                radial-gradient(ellipse 50% 60% at 80% 30%, rgba(164,108,240,0.08) 0%, transparent 70%),
                radial-gradient(ellipse 70% 40% at 50% 80%, rgba(73,179,247,0.05) 0%, transparent 70%),
                linear-gradient(180deg, #08080F 0%, #0C0C18 50%, #08080F 100%);
        }

        /* Парящие 3D-сферы — чисто CSS, GPU-accelerated */
        .orb {
            position: absolute;
            border-radius: 50%;
            will-change: transform;
            filter: blur(0.5px);
        }

        .orb-1 {
            width: 300px; height: 300px;
            top: 10%; left: 5%;
            background: radial-gradient(circle at 35% 35%, rgba(91,141,238,0.25), rgba(91,141,238,0.03) 60%, transparent 70%);
            box-shadow: inset 0 0 60px rgba(91,141,238,0.15), 0 0 80px rgba(91,141,238,0.08);
            animation: float1 20s infinite ease-in-out;
        }
        .orb-2 {
            width: 200px; height: 200px;
            top: 60%; right: 8%;
            background: radial-gradient(circle at 30% 30%, rgba(164,108,240,0.3), rgba(164,108,240,0.03) 60%, transparent 70%);
            box-shadow: inset 0 0 40px rgba(164,108,240,0.15), 0 0 60px rgba(164,108,240,0.08);
            animation: float2 25s infinite ease-in-out;
        }
        .orb-3 {
            width: 160px; height: 160px;
            bottom: 15%; left: 15%;
            background: radial-gradient(circle at 40% 30%, rgba(73,179,247,0.2), rgba(73,179,247,0.02) 60%, transparent 70%);
            box-shadow: inset 0 0 30px rgba(73,179,247,0.1), 0 0 50px rgba(73,179,247,0.06);
            animation: float3 18s infinite ease-in-out;
        }
        .orb-4 {
            width: 120px; height: 120px;
            top: 20%; right: 20%;
            background: radial-gradient(circle at 35% 35%, rgba(124,102,223,0.18), rgba(124,102,223,0.02) 60%, transparent 70%);
            box-shadow: inset 0 0 25px rgba(124,102,223,0.1), 0 0 40px rgba(124,102,223,0.05);
            animation: float4 22s infinite ease-in-out;
        }
        .orb-5 {
            width: 80px; height: 80px;
            top: 45%; left: 35%;
            background: radial-gradient(circle at 30% 30%, rgba(91,141,238,0.35), transparent 70%);
            box-shadow: 0 0 30px rgba(91,141,238,0.1);
            animation: float5 15s infinite ease-in-out;
        }

        /* Орбитальные кольца */
        .ring {
            position: absolute;
            border-radius: 50%;
            border: 1px solid rgba(255,255,255,0.04);
            will-change: transform;
        }
        .ring-1 {
            width: 500px; height: 500px;
            top: calc(50% - 250px); left: calc(50% - 250px);
            animation: spin 60s linear infinite;
        }
        .ring-1::after {
            content: '';
            position: absolute;
            width: 8px; height: 8px;
            background: #5b8dee;
            border-radius: 50%;
            top: -4px; left: calc(50% - 4px);
            box-shadow: 0 0 15px #5b8dee, 0 0 30px rgba(91,141,238,0.4);
        }
        .ring-2 {
            width: 650px; height: 650px;
            top: calc(50% - 325px); left: calc(50% - 325px);
            border-color: rgba(164,108,240,0.04);
            animation: spinReverse 80s linear infinite;
            transform: rotateX(60deg);
        }
        .ring-2::after {
            content: '';
            position: absolute;
            width: 6px; height: 6px;
            background: #a46cf0;
            border-radius: 50%;
            bottom: -3px; left: calc(50% - 3px);
            box-shadow: 0 0 12px #a46cf0, 0 0 24px rgba(164,108,240,0.4);
        }
        .ring-3 {
            width: 400px; height: 400px;
            top: calc(50% - 200px); left: calc(50% - 200px);
            border-color: rgba(73,179,247,0.03);
            animation: spin 45s linear infinite;
            transform: rotateY(50deg);
        }
        .ring-3::after {
            content: '';
            position: absolute;
            width: 5px; height: 5px;
            background: #49b3f7;
            border-radius: 50%;
            top: calc(50% - 2.5px); right: -2.5px;
            box-shadow: 0 0 10px #49b3f7, 0 0 20px rgba(73,179,247,0.4);
        }

        /* Звёзды-частицы */
        .particles {
            position: absolute; inset: 0;
        }
        .particle {
            position: absolute;
            width: 2px; height: 2px;
            background: rgba(255,255,255,0.4);
            border-radius: 50%;
            animation: twinkle 4s infinite ease-in-out;
        }

        /* Горизонтальная линия-сетка */
        .grid-line {
            position: absolute;
            width: 100%;
            height: 1px;
            background: linear-gradient(90deg, transparent 0%, rgba(91,141,238,0.06) 30%, rgba(91,141,238,0.06) 70%, transparent 100%);
        }

        @keyframes float1 {
            0%,100% { transform: translate(0,0) scale(1); }
            25% { transform: translate(30px,-20px) scale(1.05); }
            50% { transform: translate(-15px,25px) scale(0.95); }
            75% { transform: translate(20px,10px) scale(1.02); }
        }
        @keyframes float2 {
            0%,100% { transform: translate(0,0) scale(1); }
            33% { transform: translate(-25px,15px) scale(1.08); }
            66% { transform: translate(20px,-30px) scale(0.94); }
        }
        @keyframes float3 {
            0%,100% { transform: translate(0,0); }
            50% { transform: translate(35px,-20px); }
        }
        @keyframes float4 {
            0%,100% { transform: translate(0,0) rotate(0deg); }
            50% { transform: translate(-20px,30px) rotate(180deg); }
        }
        @keyframes float5 {
            0%,100% { transform: translate(0,0) scale(1); opacity: 0.6; }
            50% { transform: translate(50px, -40px) scale(1.3); opacity: 1; }
        }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        @keyframes spinReverse { from { transform: rotateX(60deg) rotate(0deg); } to { transform: rotateX(60deg) rotate(-360deg); } }
        @keyframes twinkle {
            0%,100% { opacity: 0.2; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.5); }
        }
        @keyframes pulseGlow {
            0%,100% { box-shadow: 0 0 30px rgba(91,141,238,0.15), inset 0 0 30px rgba(0,0,0,0.5); }
            50% { box-shadow: 0 0 50px rgba(91,141,238,0.25), inset 0 0 30px rgba(0,0,0,0.5); }
        }

        /* ========== КОНТЕНТ ========== */
        .content {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .logo-container {
            text-align: center;
            margin-bottom: 40px;
        }
        .logo-container img {
            width: 120px; height: 120px;
            border-radius: 50%;
            border: 2px solid rgba(91,141,238,0.3);
            box-shadow: 0 0 40px rgba(91,141,238,0.2), 0 0 80px rgba(91,141,238,0.08);
            margin-bottom: 24px;
            animation: pulseGlow 4s infinite ease-in-out;
        }
        .logo {
            font-size: 72px;
            font-weight: 800;
            letter-spacing: 8px;
            /* переливающийся фиолетово-синий градиент Mind */
            background: var(--mt-gradient-flow, linear-gradient(135deg, #a46cf0, #7c66df, #5b8dee, #49b3f7, #a46cf0));
            background-size: 200% 200%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: gradientShift 6s ease-in-out infinite;
        }
        @keyframes gradientShift {
            0%,100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }
        .sub-logo {
            font-size: 13px;
            font-weight: 400;
            color: #555566;
            letter-spacing: 4px;
            text-transform: uppercase;
            margin-top: 8px;
        }

        /* Glassmorphism search */
        .search-container {
            width: 100%;
            max-width: 640px;
            position: relative;
        }
        .search-box {
            width: 100%;
            padding: 18px 56px 18px 24px;
            font-size: 16px;
            font-weight: 400;
            font-family: 'Inter', sans-serif;
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.06);
            background: rgba(22,22,29,0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            color: #FFFFFF;
            outline: none;
            transition: all 0.4s cubic-bezier(0.16,1,0.3,1);
            box-shadow: 0 8px 32px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.06);
        }
        .search-box::placeholder { color: #555566; }
        .search-box:focus {
            border-color: rgba(91,141,238,0.5);
            box-shadow: 0 8px 32px rgba(0,0,0,0.4), 0 0 0 3px rgba(91,141,238,0.15), inset 0 1px 0 rgba(255,255,255,0.06);
        }
        .search-icon {
            position: absolute;
            right: 10px;
            top: calc(50% - 18px);
        }
        .search-icon .mi { width: 22px; height: 22px; }

        /* Shortcut cards */
        .shortcuts {
            display: flex;
            gap: 16px;
            margin-top: 40px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .shortcut {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 20px;
            border-radius: 14px;
            background: rgba(22,22,29,0.5);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,0.04);
            cursor: pointer;
            transition: transform .4s cubic-bezier(0.34, 1.56, 0.64, 1), background .3s, border-color .3s, box-shadow .3s;
            text-decoration: none;
            color: #A0A0B0;
            font-size: 13px;
            font-weight: 500;
        }
        .shortcut:hover {
            background: rgba(30,30,40,0.7);
            border-color: rgba(91,141,238,0.2);
            color: #FFFFFF;
            /* наклон за курсором (mind-ui.js) + пружинящий подъём */
            transform: perspective(800px) rotateX(var(--mt-rx, 4deg)) rotateY(var(--mt-ry, -4deg)) translateY(-3px) scale(1.04);
            box-shadow: 0 12px 28px rgba(0,0,0,0.35), 0 0 0 1px rgba(124,102,223,0.25);
        }
        .shortcut-icon {
            width: 28px; height: 28px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            /* объёмная плашка значка: мягкий градиент Mind, блик сверху */
            background: linear-gradient(135deg, rgba(164,108,240,0.18), rgba(73,179,247,0.14));
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.12), 0 4px 10px rgba(20,10,60,0.35);
        }
        .shortcut-icon .mi { width: 18px; height: 18px; }


        .footer {
            position: absolute;
            bottom: 24px;
            color: #333344;
            font-size: 11px;
            font-weight: 300;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <!-- ЖИВАЯ 3D-СЦЕНА (чистый CSS, 0% CPU — всё на GPU transform) -->
    <div class="scene">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
        <div class="orb orb-4"></div>
        <div class="orb orb-5"></div>

        <div class="ring ring-1"></div>
        <div class="ring ring-2"></div>
        <div class="ring ring-3"></div>

        <div class="particles" id="particles"></div>

        <div class="grid-line" style="top: 25%;"></div>
        <div class="grid-line" style="top: 50%;"></div>
        <div class="grid-line" style="top: 75%;"></div>
    </div>

    <!-- КОНТЕНТ -->
    <div class="content">
        <div class="logo-container mt-bounce-in">
            <img src="logo.png" alt="ITIS">
            <h1 class="logo">ITIS</h1>
            <p class="sub-logo">Iskaliev Tagir Independent Surfing</p>
        </div>

        <div class="search-container">
            <input type="text" id="searchInput" class="search-box" placeholder="Поиск или введите URL..." autofocus>
            <button class="mt-icon-btn search-icon" type="button" onclick="performSearch()" title="Найти"><i class="mi mi-search"></i></button>
        </div>

        <div class="shortcuts mt-bounce-in" style="animation-delay:.12s">
            <a class="shortcut mt-3d" data-mt-tilt href="https://www.youtube.com">
                <span class="shortcut-icon"><i class="mi mi-play"></i></span>
                YouTube
            </a>
            <a class="shortcut mt-3d" data-mt-tilt href="https://github.com">
                <span class="shortcut-icon"><i class="mi mi-code"></i></span>
                GitHub
            </a>
            <a class="shortcut mt-3d" data-mt-tilt href="https://search.brave.com">
                <span class="shortcut-icon"><i class="mi mi-shield"></i></span>
                Brave
            </a>
            <a class="shortcut mt-3d" data-mt-tilt href="https://wikipedia.org">
                <span class="shortcut-icon"><i class="mi mi-globe"></i></span>
                Wikipedia
            </a>
        </div>
    </div>

    <div class="footer">© 2026 ITIS · Privacy First</div>

    <script>
        // Генерация звёзд-частиц
        (function() {
            const container = document.getElementById('particles');
            for (let i = 0; i < 40; i++) {
                const p = document.createElement('div');
                p.className = 'particle';
                p.style.left = Math.random() * 100 + '%';
                p.style.top = Math.random() * 100 + '%';
                p.style.animationDelay = (Math.random() * 4) + 's';
                p.style.animationDuration = (3 + Math.random() * 4) + 's';
                p.style.width = p.style.height = (1 + Math.random() * 2) + 'px';
                container.appendChild(p);
            }
        })();

        function performSearch() {
            const query = document.getElementById('searchInput').value;
            if (query.trim() !== '') {
                window.location.href = 'itis-search://search/?q=' + encodeURIComponent(query);
            }
        }
        document.getElementById('searchInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') performSearch();
        });
    </script>
</body>
</html>
